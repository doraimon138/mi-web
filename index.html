<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sorpresa</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
      text-align: center;
      padding-top: 100px;
    }
    h1 {
      font-size: 40px;
    }
  </style>
</head>
<body>

<h1>Conectando...</h1>
<p id="info"></p>

<script>
fetch("https://ipapi.co/json/")
  .then(res => res.json())
  .then(data => {
    document.querySelector("h1").textContent = "Te estoy viendo 👁️";
    document.getElementById("info").innerHTML = `
      IP: ${data.ip} <br>
      Ciudad: ${data.city} <br>
      País: ${data.country_name}
    `;
  })
  .catch(() => {
    document.querySelector("h1").textContent = "No pude encontrarte...";
  });
</script>

</body>
</html>
