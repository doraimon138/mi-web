<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Amor</title>
<style>
  body {
    background: black;
    color: #00ff00;
    font-family: monospace;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    transition: all 0.5s;
  }

  #terminal {
    white-space: pre-line;
    font-size: 18px;
  }

  #mensaje-broma {
    display: none;
    font-size: 24px;
    color: #ff69b4;
    text-align: center;
    margin-top: 20px;
  }

  @keyframes latido {
    0% { transform: scale(1); }
    25% { transform: scale(1.2); }
    50% { transform: scale(1); }
    75% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
</style>
</head>

<body>

<div id="terminal"></div>
<div id="mensaje-broma">jajaja que tonta eres</div>

<audio id="beep" src="https://www.soundjay.com/button/beep-07.wav"></audio>

<script>
const terminal = document.getElementById("terminal");
const beep = document.getElementById("beep");
const mensajeBroma = document.getElementById("mensaje-broma");

function sonido() {
  beep.currentTime = 0;
  beep.play().catch(()=>{});
}

function escribir(texto, delay = 35) {
  return new Promise(resolve => {
    let i = 0;
    const intervalo = setInterval(() => {
      terminal.innerHTML += texto[i];
      sonido();
      i++;
      if (i >= texto.length) {
        clearInterval(intervalo);
        terminal.innerHTML += "\n";
        resolve();
      }
    }, delay);
  });
}

async function iniciar() {
  let nombre = prompt("Verificando identidad... Introduce tu nombre:");
  if (!nombre) nombre = "usuario";

  await escribir("Inicializando protocolo secreto...");
  await escribir("Reconociendo identidad: " + nombre);
  await escribir("Conexión establecida...");
  await escribir("Analizando sistema...");

  // mensaje final
  terminal.style.display = "none";
  mensajeBroma.style.display = "block";
}

iniciar();
</script>

</body>
</html>
