<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema</title>

<style>
  body {
    background: black;
    color: #00ff00;
    font-family: monospace;
    padding: 30px;
  }

  #terminal {
    white-space: pre-line;
    font-size: 18px;
  }

  #ip, #contador, #final {
    margin-top: 20px;
  }

  #contador {
    color: red;
    font-size: 40px;
  }

  #final {
    display: none;
    color: pink;
    font-size: 26px;
  }
</style>

</head>

<body>

<div id="terminal"></div>
<div id="ip"></div>
<div id="contador"></div>
<div id="final">es broma mi niña te quiero 💜</div>

<script>
window.onload = () => {

  // 🔥 LIMPIEZA TOTAL (evita duplicados sí o sí)
  document.getElementById("terminal").innerHTML = "";
  document.getElementById("ip").innerHTML = "";
  document.getElementById("contador").innerHTML = "";

  const terminal = document.getElementById("terminal");
  const ipDiv = document.getElementById("ip");
  const contadorDiv = document.getElementById("contador");
  const finalDiv = document.getElementById("final");

  function escribir(texto, delay = 30) {
    return new Promise(resolve => {
      let i = 0;
      const interval = setInterval(() => {
        terminal.innerHTML += texto[i];
        i++;
        if (i >= texto.length) {
          clearInterval(interval);
          terminal.innerHTML += "\n";
          resolve();
        }
      }, delay);
    });
  }

  async function iniciar() {

    await escribir("Verificando sistema...");
    await escribir("Conectando núcleo...");
    await escribir("Analizando dispositivo...");

    try {
      const res = await fetch("https://ipapi.co/json/");
      const data = await res.json();

      ipDiv.innerHTML = "IP detectada: " + data.ip;

      await escribir("Ciudad: " + data.city);
      await escribir("Proveedor: " + data.org);

    } catch {
      await escribir("Error obteniendo IP...");
    }

    await escribir("\nEste dispositivo se autodestruirá en...");

    let t = 10;
    contadorDiv.innerHTML = t;

    const interval = setInterval(() => {
      t--;
      contadorDiv.innerHTML = t;

      if (t <= 0) {
        clearInterval(interval);

        terminal.style.display = "none";
        ipDiv.style.display = "none";
        contadorDiv.style.display = "none";

        finalDiv.style.display = "block";
      }
    }, 1000);
  }

  iniciar();
};
</script>

</body>
</html>
