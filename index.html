<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Primera Web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: white;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #38bdf8;
    }
    p {
      font-size: 18px;
    }
    button {
      background: #38bdf8;
      border: none;
      padding: 10px 20px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Bienvenido a mi web</h1>
  <p>Esta es mi primera página hecha con HTML 😎</p>

  <button onclick="saludar()">Haz clic</button>

  <script>
    function saludar() {
      alert("¡Hola! Gracias por visitar mi web 🚀");
    }
  </script>

</body>
</html>
