<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cuenta regresiva del amor</title>
  <style>
    body {
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    #contador {
      font-size: 50px;
      margin-bottom: 30px;
    }
    #corazon {
      display: none;
      font-size: 100px;
      color: purple;
      text-align: center;
      line-height: 1.2;
      animation: crecer 1s ease-in-out forwards;
    }
    @keyframes crecer {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<div id="contador">15</div>
<div id="corazon">💜<br>Te amo</div>

<script>
let tiempo = 15;
const contador = document.getElementById("contador");
const corazon = document.getElementById("corazon");

const intervalo = setInterval(() => {
  tiempo--;
  contador.textContent = tiempo;
  if (tiempo <= 0) {
    clearInterval(intervalo);
    contador.style.display = "none";
    corazon.style.display = "block";
  }
}, 1000);
</script>

</body>
</html>
