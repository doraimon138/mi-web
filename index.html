<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Amor</title>
<style>
  body {
    background: black;
    color: #00ff00;
    font-family: monospace;
    padding: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  #terminal {
    white-space: pre-line;
    font-size: 20px;
    text-align: center;
  }

  #mensaje {
    display: none;
    font-size: 28px;
    color: #ff69b4;
    margin-top: 20px;
  }

  #contador {
    font-size: 32px;
    margin-bottom: 20px;
  }
</style>
</head>

<body>

<div id="contador"></div>
<div id="mensaje">jajaja que tonta eres</div>

<script>
const contador = document.getElementById("contador");
const mensaje = document.getElementById("mensaje");

async function iniciar() {
  let tiempo = 10;

  while (tiempo > 0) {
    contador.innerHTML = "Cuenta atrás: " + tiempo;
    await new Promise(r => setTimeout(r, 1000));
    tiempo--;
  }

  contador.style.display = "none";
  mensaje.style.display = "block";
}

iniciar();
</script>

</body>
</html>
