<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema</title>
  <style>
    body {
      background: black;
      color: #00ff00;
      font-family: monospace;
      padding: 30px;
      transition: all 0.5s;
    }
    #terminal {
      white-space: pre-line;
      font-size: 18px;
    }
    .alerta {
      background: #2b0000 !important;
      color: red !important;
    }
  </style>
</head>
<body>

<div id="terminal"></div>

<audio id="beep" src="https://www.soundjay.com/button/beep-07.wav"></audio>

<script>
const terminal = document.getElementById("terminal");
const beep = document.getElementById("beep");

function sonido() {
  beep.currentTime = 0;
  beep.play().catch(()=>{});
}

function escribir(texto, delay = 35) {
  return new Promise(resolve => {
    let i = 0;
    const intervalo = setInterval(() => {
      terminal.innerHTML += texto[i];
      sonido();
      i++;
      if (i >= texto.length) {
        clearInterval(intervalo);
        terminal.innerHTML += "\n";
        resolve();
      }
    }, delay);
  });
}

async function cuentaAtras(segundos) {
  for (let i = segundos; i > 0; i--) {
    await escribir("Tiempo restante: " + i + "s", 20);
  }
}

async function iniciar() {
  let nombre = prompt("Verificando identidad... Introduce tu nombre:");
  if (!nombre) nombre = "usuario";

  await escribir("Inicializando protocolo...");
  await escribir("Accediendo al sistema...");
  await escribir("Identidad detectada: " + nombre + "\n");

  await escribir("Estableciendo conexión...");
  await escribir("Extrayendo datos...\n");

  try {
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();

    await escribir("IP: " + data.ip);
    await escribir("Ubicación: " + data.city + ", " + data.country_name);
    await escribir("Proveedor: " + data.org + "\n");

    if (data.org && (
      data.org.includes("VPN") ||
      data.org.includes("Cloud") ||
      data.org.includes("Hosting") ||
      data.org.includes("Server")
    )) {
      document.body.classList.add("alerta");

      await escribir("⚠️ ACTIVIDAD ANÓMALA DETECTADA");
      await escribir("Analizando conexión...");
      await escribir("Posible uso de red protegida...");
    } else {
      await escribir("Conexión estable");
    }

    await escribir("\nAcceso a sistema concedido...");
    await escribir("Sincronizando datos...");

    await escribir("\n" + nombre + ", hemos registrado tu acceso...");
    await escribir("No cierres esta ventana...\n");

    await cuentaAtras(5);

    await escribir("Finalizando proceso...");
    await escribir("Sesión registrada correctamente.");

  } catch {
    await escribir("Error en conexión...");
  }
}

iniciar();
</script>

</body>
</html>
